[workspace]
resolver = "3"
members = [
    "crates/ebms-core",
    "crates/ebms-vfs-fuse",
    "crates/ebms-vfs-winfsp",
    "crates/ebms-cli",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.23"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
crc32fast = "1"
dirs = "7"
futures-util = "0.3"
getrandom = "0.4"
hex = "0.4"
keyring = "4"
open = "5"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "gzip", "json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "net", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
