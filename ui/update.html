<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EBMS 업데이트</title>
  <link rel="stylesheet" href="style.css">
  <script src="update.js" defer></script>
</head>
<body>
  <main class="update">
    <h1>새 버전이 있습니다</h1>
    <p id="version" class="muted"></p>
    <p>업데이트할까요? 받은 뒤 EBMS를 다시 시작합니다. 설정과 받은 곡(<code>data</code> 폴더)은 그대로 둡니다.</p>
    <p id="notes" class="notes" hidden></p>
    <p id="message" class="message" hidden></p>
    <footer>
      <button id="later" class="secondary">나중에</button>
      <button id="apply">업데이트</button>
    </footer>
  </main>
</body>
</html>
