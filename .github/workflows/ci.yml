name: CI

on:
  push:
    branches: [release, stage, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # 설정 창(Tauri) 웹뷰
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # 릴리스에 넣는 라이선스 고지가 만들어지는지(about.toml에 없는 라이선스가 들어오면 실패)
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: cargo about generate --workspace about.hbs -o /dev/null

  # 클라이언트는 Windows 전용입니다. 테스트는 Windows에서만 돌립니다.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
