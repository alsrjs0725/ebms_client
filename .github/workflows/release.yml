name: Release

# release 병합 시 정식 릴리스 v<버전>, stage 병합 시 사전 릴리스 `stage`를 갱신
on:
  push:
    branches: [release, stage]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 전용
          - os: windows-latest
            platform: windows-x64
            exe: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release -p ebms-app --features tauri/custom-protocol
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      # 포함된 crate의 저작권·라이선스 고지(about.toml, about.hbs)
      - run: cargo about generate --workspace about.hbs -o THIRD_PARTY_LICENSES.html
      - name: 패키징
        shell: bash
        run: |
          name="ebms-${{ matrix.platform }}"
          mkdir -p "dist/$name"
          # 실행에 필요한 앱과 라이선스 고지만 담는다
          cp "target/release/ebms-app${{ matrix.exe }}" LICENSE THIRD_PARTY_LICENSES.html "dist/$name/"
          cd dist
          7z a "$name.zip" "$name" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: ebms-${{ matrix.platform }}
          path: dist/ebms-${{ matrix.platform }}.*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: GitHub Release 업로드
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          notes="커밋 ${GITHUB_SHA::7} (${GITHUB_REF_NAME}). Windows 가상 드라이브에는 WinFsp(https://winfsp.dev/rel/) 설치가 필요합니다."
          if [ "$GITHUB_REF_NAME" = "release" ]; then
            tag="v$version"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "::error::$tag 릴리스가 이미 있습니다. Cargo.toml의 workspace 버전을 올린 뒤 병합하세요."
              exit 1
            fi
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "EBMS $tag" --notes "$notes"
          else
            tag="stage"
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --prerelease \
              --title "EBMS stage (v$version, ${GITHUB_SHA::7})" --notes "$notes"
          fi
